steps:
  - require: repository-files.yaml

  # Fixers rewrite files, so they run one after another and every other check starts after
  # them. `after` only orders: a failed fixer still lets every later check run and report.
  - concurrent:
      max_concurrency: 4
      fail_fast: false
      steps:
        - id: trailing_whitespace
          type: text_fix
          if: len(steps.selected.text) > 0
          with: {files: {expr: steps.selected.text}, trailing_whitespace: true}

        - id: end_of_file_fixer
          after: [trailing_whitespace]
          type: text_fix
          if: len(steps.selected.text) > 0
          with: {files: {expr: steps.selected.text}, final_newline: true}

        - id: gofmt
          after: [end_of_file_fixer]
          uses: ../actions/gofmt
          if: len(steps.selected.go) > 0
          with:
            files: {expr: steps.selected.go}

        - id: check_yaml
          after: [gofmt]
          type: text_check
          if: len(steps.selected.yaml) > 0
          with: {files: {expr: steps.selected.yaml}, parse: yaml}

        - id: check_toml
          after: [gofmt]
          type: text_check
          if: len(steps.selected.toml) > 0
          with: {files: {expr: steps.selected.toml}, parse: toml}

        - id: check_merge_conflict
          after: [gofmt]
          type: text_check
          if: steps.files.state != "none" && len(steps.selected.text) > 0
          with:
            files: {expr: steps.selected.text}
            forbid:
              - {pattern: '(?m)^(<<<<<<< |======= |=======\r?\n|>>>>>>> )', message: Merge conflict marker}

        - id: check_added_large_files
          after: [gofmt]
          type: text_check
          if: len(steps.selected.added) > 0
          with:
            files: {expr: steps.selected.added}
            max_size: 500KiB
            size_exempt: {expr: 'filter(steps.selected.added, {steps.files.attributes.filter[#] == "lfs"})'}

        - id: check_case_conflict
          after: [gofmt]
          type: assert
          if: len(steps.selected.files) > 0
          with:
            expr: len(steps.files.case_conflicts) == 0
            message: 'Case-insensitivity conflict: {{ join ", " .steps.files.case_conflicts }}'

        - id: detect_private_key
          after: [gofmt]
          type: text_check
          if: len(steps.selected.text) > 0
          with:
            files: {expr: steps.selected.text}
            # The patterns avoid spelling out a key header, so this file never matches itself.
            forbid:
              - {pattern: 'BEGIN (RSA |DSA |EC |OPENSSH |SSH2 ENCRYPTED |ENCRYPTED |PGP )?PRIVATE KEY', message: Private key found}
              - {pattern: 'PuTTY-User-Key-File-[2]', message: Private key found}
              - {pattern: 'BEGIN OpenVPN Static key V[1]', message: Private key found}

        - id: go_vet
          after: [gofmt]
          type: shell
          if: len(steps.selected.vet) > 0
          with:
            argv: {expr: 'concat(["go", "vet"], steps.selected.vet)'}

        - id: go_mod_tidy
          after: [gofmt]
          type: shell
          if: steps.selected.tidy
          with: {command: go, args: [mod, tidy, -diff]}

        - id: staticcheck
          after: [gofmt]
          type: shell
          if: vars.stage == "push" && steps.selected.lint
          with: {command: sh, args: [scripts/lint.sh]}

        - id: go_test
          after: [gofmt]
          type: shell
          if: vars.stage == "push" && len(steps.selected.go) > 0
          with: {command: go, args: [test, -race, ./...]}
