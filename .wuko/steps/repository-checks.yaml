steps:
  - require: repository-files.yaml

  # Fixers rewrite files, so they run one after another and every other check starts after
  # them. `after` only orders: a failed fixer still lets every later check run and report.
  - concurrent:
      max_concurrency: 4
      fail_fast: false
      steps:
        - id: trailing_whitespace
          type: text_fix
          if: len(steps.selected.text) > 0
          with: {files: {expr: steps.selected.text}, trailing_whitespace: true}

        - id: end_of_file_fixer
          after: [trailing_whitespace]
          type: text_fix
          if: len(steps.selected.text) > 0
          with: {files: {expr: steps.selected.text}, final_newline: true}

        - id: gofmt
          after: [end_of_file_fixer]
          uses: ../actions/file-check
          if: len(steps.selected.go) > 0
          with:
            check: gofmt
            files: {expr: steps.selected.go}

        - id: check_yaml
          after: [gofmt]
          uses: ../actions/file-check
          if: len(steps.selected.yaml) > 0
          with:
            check: yaml
            files: {expr: steps.selected.yaml}

        - id: check_toml
          after: [gofmt]
          uses: ../actions/file-check
          if: len(steps.selected.toml) > 0
          with:
            check: toml
            files: {expr: steps.selected.toml}

        - id: check_merge_conflict
          after: [gofmt]
          uses: ../actions/file-check
          if: steps.repository.merge && len(steps.selected.text) > 0
          with:
            check: merge
            files: {expr: steps.selected.text}

        - id: check_added_large_files
          after: [gofmt]
          uses: ../actions/file-check
          if: len(steps.selected.added) > 0
          with:
            check: large
            files: {expr: steps.selected.added}
            lfs: {expr: steps.selected.lfs}

        - id: check_case_conflict
          after: [gofmt]
          type: lua
          if: len(steps.selected.files) > 0
          with:
            args:
              index: {expr: steps.repository.index}
              added: {expr: steps.selected.added}
              selected: {expr: steps.selected.files}
            source: |
              local groups, relevant = {}, {}
              local function include(path, selected)
                while path do
                  local lower = wuko.helpers.lower(path)
                  groups[lower] = groups[lower] or {}
                  groups[lower][path] = true
                  if selected then relevant[lower] = true end
                  path = path:match("^(.*)/[^/]+$")
                end
              end
              for _, path in ipairs(wuko.args.index) do include(path, false) end
              for _, path in ipairs(wuko.args.added) do include(path, true) end
              for _, path in ipairs(wuko.args.selected) do include(path, true) end
              local conflicts = {}
              for lower, paths in pairs(groups) do
                local names = {}
                for path in pairs(paths) do names[#names+1] = path end
                if relevant[lower] and #names > 1 then
                  for _, path in ipairs(names) do conflicts[#conflicts+1] = path end
                end
              end
              table.sort(conflicts)
              assert(#conflicts == 0, "Case-insensitivity conflict: " .. table.concat(conflicts, ", "))

        - id: detect_private_key
          after: [gofmt]
          uses: ../actions/file-check
          if: len(steps.selected.text) > 0
          with:
            check: private_key
            files: {expr: steps.selected.text}

        - id: go_vet
          after: [gofmt]
          type: shell
          if: len(steps.selected.vet) > 0
          with:
            argv: {expr: 'concat(["go", "vet"], steps.selected.vet)'}

        - id: go_mod_tidy
          after: [gofmt]
          type: shell
          if: steps.selected.tidy
          with: {command: go, args: [mod, tidy, -diff]}

        - id: staticcheck
          after: [gofmt]
          type: shell
          if: vars.stage == "push" && steps.selected.lint
          with: {command: sh, args: [scripts/lint.sh]}

        - id: go_test
          after: [gofmt]
          type: shell
          if: vars.stage == "push" && len(steps.selected.go) > 0
          with: {command: go, args: [test, -race, ./...]}
