steps:
  # Each target sets vars.source to staged, pushed, or all.
  - id: files
    type: git_files
    with:
      source: "{{ .vars.source }}"
      exclude: ['^dist/', '^completions/']
      detect_case_conflicts: true
      attributes: [filter]

  - id: go_packages
    type: lua
    with:
      args:
        source: "{{ .vars.source }}"
        files: {expr: steps.files.files}
        deleted: {expr: steps.files.deleted}
      source: |
        -- Vet only the packages whose Go files changed, following the directories ./... skips.
        -- A module change can affect every package, so it vets them all.
        local vet, seen, modules = wuko.array(), {}, {}
        local function exists(path) return (pcall(wuko.fs.stat, path)) end
        local function nested(dir)
          while dir ~= "." do
            if modules[dir] == nil then modules[dir] = exists(dir.."/go.mod") end
            if modules[dir] then return true end
            dir = dir:match("^(.*)/[^/]+$") or "."
          end
          return false
        end
        local function has_go(dir)
          local ok, entries = pcall(wuko.fs.list, dir)
          if not ok then return false end
          for _, entry in ipairs(entries) do
            if not entry.is_dir and entry.name:match("%.go$") then return true end
          end
          return false
        end
        local changed = {}
        for _, list in ipairs({wuko.args.files, wuko.args.deleted}) do
          for _, path in ipairs(list) do changed[#changed+1] = path end
        end
        for _, path in ipairs(changed) do
          if path == "go.mod" or path == "go.sum" or wuko.args.source == "all" then vet = {"./..."}; break end
          local dir = path:match("^(.*)/[^/]+$") or "."
          local skipped = ("/"..dir):match("/[._][^/]*") and dir ~= "." or ("/"..dir.."/"):match("/testdata/")
          if path:match("%.go$") and not seen[dir] and not skipped then
            seen[dir] = true
            if not nested(dir) and has_go(dir) then vet[#vet+1] = dir == "." and "." or "./"..dir end
          end
        end
        table.sort(vet)
        wuko.output("vet", vet)

  - id: selected
    type: lua
    with:
      args:
        files: {expr: steps.files.files}
        text: {expr: steps.files.text}
        added: {expr: steps.files.added}
        vet: {expr: steps.go_packages.vet}
      source: |
        local result = {files=wuko.args.files, text=wuko.args.text, yaml=wuko.array(), toml=wuko.array(), go=wuko.array(), added=wuko.args.added, vet=wuko.args.vet, tidy=false, lint=false}
        for _, path in ipairs(wuko.args.files) do
          local extension = wuko.helpers.lower(path:match("%.([^./]+)$") or "")
          local format = ({yml="yaml", yaml="yaml", toml="toml", go="go"})[extension]
          if format then result[format][#result[format]+1] = path end
          result.tidy = result.tidy or path == "go.mod" or path == "go.sum"
          result.lint = result.lint or extension == "go" or path == "go.mod" or path == "go.sum" or path == "staticcheck.conf" or path == "scripts/lint.sh" or path == "justfile" or path == ".github/workflows/ci.yml" or path:match("^%.wuko/") ~= nil
        end
        for name, value in pairs(result) do wuko.output(name, value) end
