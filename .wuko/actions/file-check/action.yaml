version: 1
name: repository-file-check
description: Apply one repository policy to each selected file
inputs:
  check: {type: string, required: true}
  files: {type: array, required: true}
  lfs: {type: object, default: {}}
steps:
  # One Lua pass reads each file once and keeps no per-file step state.
  - id: contents
    type: lua
    if: inputs.check in ["yaml", "toml", "merge", "private_key", "large"]
    with:
      args:
        check: "{{ .inputs.check }}"
        files: {expr: inputs.files}
        lfs: {expr: inputs.lfs}
      source: |
        local check, failed = wuko.args.check, {}
        -- Signatures are split so this file does not match the private key scan.
        local signatures = {"BEGIN ".."PRIVATE KEY", "BEGIN ".."PGP PRIVATE KEY BLOCK", "PuTTY-".."User-Key-File-2", "BEGIN ".."OpenVPN Static key V1"}
        for _, kind in ipairs({"RSA", "DSA", "EC", "OPENSSH", "SSH2 ENCRYPTED", "ENCRYPTED"}) do
          signatures[#signatures+1] = "BEGIN "..kind.." PRIVATE KEY"
        end
        local function has_marker(text)
          return wuko.helpers.regex_match(text, [[(?m)^(<<<<<<< |======= |=======\r?\n|>>>>>>> )]])
        end
        local function has_key(text)
          for _, signature in ipairs(signatures) do
            if text:find(signature, 1, true) then return true end
          end
          return false
        end
        local parsers = {yaml=wuko.yaml.decode, toml=wuko.toml.decode}
        for _, path in ipairs(wuko.args.files) do
          if check == "large" then
            if not wuko.args.lfs[path] and wuko.fs.stat(path).size > 512000 then failed[#failed+1] = path end
          elseif parsers[check] then
            local ok, err = pcall(parsers[check], wuko.fs.read(path))
            -- Drop the Lua position so the message names the file and its own line.
            if not ok then failed[#failed+1] = path .. ": " .. wuko.helpers.regex_replace(tostring(err), [[^\S*:\d+: ]], "") end
          else
            local text = wuko.fs.read(path)
            if (check == "merge" and has_marker(text)) or (check == "private_key" and has_key(text)) then failed[#failed+1] = path end
          end
        end
        local messages = {yaml="Invalid YAML:\n", toml="Invalid TOML:\n", merge="Merge conflict marker in ", private_key="Private key found: ", large="Files exceed 500 KiB: "}
        local separator = parsers[check] and "\n" or ", "
        assert(#failed == 0, messages[check] .. table.concat(failed, separator))

  - id: gofmt
    if: inputs.check == "gofmt"
    batch:
      items: inputs.files
      # One gofmt process per thousand files keeps argv well under the OS limit.
      size: 1000
      max_concurrency: 1
      max_iterations: 100000
      fail_fast: false
      steps:
        - id: format
          type: shell
          with:
            argv: {expr: 'concat(["gofmt", "-l", "-w", "--"], batch.items)'}
        - id: unchanged
          type: assert
          with:
            expr: steps.format.stdout == ""
            message: "gofmt modified files; review and stage the changes"
