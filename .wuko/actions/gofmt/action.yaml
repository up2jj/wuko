version: 1
name: repository-gofmt
description: Format Go files and fail when gofmt changed any
inputs:
  files: {type: array, required: true}
steps:
  # A batch cannot sit directly in a concurrent group, so the caller wraps it in this action.
  - id: gofmt
    batch:
      items: inputs.files
      # One gofmt process per thousand files keeps argv well under the OS limit.
      size: 1000
      max_concurrency: 1
      max_iterations: 100000
      fail_fast: false
      steps:
        - id: format
          type: shell
          with:
            argv: {expr: 'concat(["gofmt", "-l", "-w", "--"], batch.items)'}
        - id: unchanged
          type: assert
          with:
            expr: steps.format.stdout == ""
            message: "gofmt modified files; review and stage the changes"
