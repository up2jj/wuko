name: ci

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: build CI reporter smoke binary
        run: go build -o "$RUNNER_TEMP/wuko" .
      - name: run CI reporter smoke workflow
        id: wuko_smoke
        run: |
          "$RUNNER_TEMP/wuko" run --file .github/fixtures/ci-smoke.yaml --once --reporter plain --reporter github
      - name: verify CI reporter outputs
        env:
          RESULT: ${{ steps.wuko_smoke.outputs.result }}
          WUKO_OUTPUTS: ${{ steps.wuko_smoke.outputs.wuko_outputs }}
        run: |
          test "$RESULT" = "ready"
          test "$WUKO_OUTPUTS" = '{"result":"ready"}'
      - name: install VHS
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf
        with:
          version: "v0.11.0"
      - name: validate VHS demos
        run: vhs validate 'docs/demos/*.tape'
      - name: verify VHS demo assets
        run: |
          test -s docs/assets/workflow-picker.gif
          test -s docs/assets/interactive-workflow.gif
          test -s docs/assets/workflow-tree.png
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || { echo "Unformatted files:"; gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean

  action:
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: build action test binary
        run: go build -o "$RUNNER_TEMP/wuko-action-test" .
      - name: run file workflow through action
        id: file
        uses: ./
        with:
          workflow: .github/fixtures/ci-smoke.yaml
        env:
          WUKO_ACTION_TEST_BINARY: ${{ runner.temp }}/wuko-action-test
      - name: run inline workflow through action
        id: inline
        uses: ./
        with:
          definition: |
            version: 1
            name: inline-action-smoke
            targets:
              smoke:
                steps:
                  - id: github_token
                    type: shell
                    with:
                      script: test -n "$GH_TOKEN"
                  - id: github_pull_request
                    type: github_pr
                    with:
                      operation: find
                      repository: "{{ .env.GITHUB_REPOSITORY }}"
                      branch: wuko-action-token-smoke
                  - require: fragments/return.yaml
          target: smoke
          working-directory: .github/fixtures/action-inline
          vars: |
            result=inline-ready
            enabled=true
        env:
          WUKO_ACTION_TEST_BINARY: ${{ runner.temp }}/wuko-action-test
      - name: verify action outputs
        env:
          FILE_OUTPUTS: ${{ steps.file.outputs.outputs }}
          FILE_STATUS: ${{ steps.file.outputs.status }}
          FILE_EXECUTION_ID: ${{ steps.file.outputs.execution-id }}
          FILE_DURATION_MS: ${{ steps.file.outputs.duration-ms }}
          FILE_FAILED_STEP: ${{ steps.file.outputs.failed-step }}
          FILE_REPORT: ${{ steps.file.outputs.report }}
          INLINE_OUTPUTS: ${{ steps.inline.outputs.outputs }}
        run: |
          test "$FILE_OUTPUTS" = '{"result":"ready"}'
          test "$FILE_STATUS" = succeeded
          test -n "$FILE_EXECUTION_ID"
          [[ "$FILE_DURATION_MS" =~ ^[0-9]+$ ]]
          test -z "$FILE_FAILED_STEP"
          test "$(jq -r .invocation_id <<<"$FILE_REPORT")" = "$FILE_EXECUTION_ID"
          test "$(jq -r .status <<<"$FILE_REPORT")" = succeeded
          test "$(jq -r .outputs.result <<<"$FILE_REPORT")" = ready
          test "$INLINE_OUTPUTS" = '{"enabled":true,"result":"inline-ready"}'
      - name: prefer token input over caller environment
        uses: ./
        with:
          definition: |
            version: 1
            name: action-token-override
            steps:
              - id: verify_token
                type: shell
                with:
                  script: test "$GH_TOKEN" = "token-from-input"
          token: token-from-input
        env:
          GH_TOKEN: token-from-environment
          WUKO_ACTION_TEST_BINARY: ${{ runner.temp }}/wuko-action-test
      - name: reject both workflow sources
        id: invalid-both
        continue-on-error: true
        uses: ./
        with:
          workflow: check
          definition: "version: 1"
        env:
          WUKO_ACTION_TEST_BINARY: ${{ runner.temp }}/wuko-action-test
      - name: reject a missing workflow source
        id: invalid-neither
        continue-on-error: true
        uses: ./
        env:
          WUKO_ACTION_TEST_BINARY: ${{ runner.temp }}/wuko-action-test
      - name: reject invalid variables
        id: invalid-vars
        continue-on-error: true
        uses: ./
        with:
          workflow: .github/fixtures/ci-smoke.yaml
          vars: "["
        env:
          WUKO_ACTION_TEST_BINARY: ${{ runner.temp }}/wuko-action-test
      - name: report a failed workflow
        id: failed-workflow
        continue-on-error: true
        uses: ./
        with:
          definition: |
            version: 1
            name: failed-action-smoke
            steps:
              - id: explode
                type: shell
                with: {script: "exit 7"}
        env:
          WUKO_ACTION_TEST_BINARY: ${{ runner.temp }}/wuko-action-test
      - name: require validation failures
        env:
          BOTH_OUTCOME: ${{ steps.invalid-both.outcome }}
          NEITHER_OUTCOME: ${{ steps.invalid-neither.outcome }}
          VARS_OUTCOME: ${{ steps.invalid-vars.outcome }}
          VARS_STATUS: ${{ steps.invalid-vars.outputs.status }}
          VARS_EXECUTION_ID: ${{ steps.invalid-vars.outputs.execution-id }}
          VARS_REPORT: ${{ steps.invalid-vars.outputs.report }}
          FAILED_OUTCOME: ${{ steps.failed-workflow.outcome }}
          FAILED_OUTPUTS: ${{ steps.failed-workflow.outputs.outputs }}
          FAILED_STATUS: ${{ steps.failed-workflow.outputs.status }}
          FAILED_EXECUTION_ID: ${{ steps.failed-workflow.outputs.execution-id }}
          FAILED_DURATION_MS: ${{ steps.failed-workflow.outputs.duration-ms }}
          FAILED_STEP: ${{ steps.failed-workflow.outputs.failed-step }}
          FAILED_REPORT: ${{ steps.failed-workflow.outputs.report }}
        run: |
          test "$BOTH_OUTCOME" = failure
          test "$NEITHER_OUTCOME" = failure
          test "$VARS_OUTCOME" = failure
          test "$VARS_STATUS" = failed
          test -n "$VARS_EXECUTION_ID"
          jq -e '.status == "failed" and (has("run_id") | not) and (has("outputs") | not)' <<<"$VARS_REPORT"
          test "$FAILED_OUTCOME" = failure
          test -z "$FAILED_OUTPUTS"
          test "$FAILED_STATUS" = failed
          test -n "$FAILED_EXECUTION_ID"
          [[ "$FAILED_DURATION_MS" =~ ^[0-9]+$ ]]
          test "$FAILED_STEP" = explode
          test "$(jq -r .failed_step <<<"$FAILED_REPORT")" = explode
          jq -e '.status == "failed" and (has("outputs") | not)' <<<"$FAILED_REPORT"
      - name: exercise release download
        if: runner.os == 'Linux'
        uses: ./
        with:
          workflow: .github/fixtures/ci-smoke.yaml
          version: 0.12.0
