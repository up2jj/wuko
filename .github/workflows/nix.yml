name: nix

# Run only when a change can affect the flake: its own files, the Go sources and embedded
# assets that flake.nix passes to the build, or the release version it stamps.
on:
  pull_request:
    paths: &nix-paths
      - flake.nix
      - flake.lock
      - nix/**
      - go.mod
      - go.sum
      - "**.go"
      - "!docs/**"
      - cmd/**
      - scriptsdk/**
      - skills/**
      - action/version
      - .github/workflows/nix.yml
  push:
    branches:
      - master
    paths: *nix-paths

jobs:
  nix:
    strategy:
      matrix:
        # Other systems, including x86_64-darwin, are evaluated but not built.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: check Nix formatting
        if: runner.os == 'Linux'
        run: nix fmt -- --check flake.nix nix/package.nix
      # Evaluates every supported system and builds the checks for the runner's own system.
      - name: evaluate all systems and test the native package
        run: nix flake check --all-systems -L
