- id: basic
  title: Use tui_password
  description: A complete workflow demonstrating tui_password. Save it as workflow.yaml together with any supporting files.
  workflow: |
    version: 1
    name: tui-password-basic
    steps:
      - id: example
        type: tui_password
        with:
          variable: api_token
          message: Enter a demonstration token
          required: true
  files: {}
  prerequisites:
    - An interactive terminal
    - Use a synthetic value for this example
  expected: Reads masked input into vars.api_token; does not print the value.
  check: ""
  run: false
