- id: basic
  title: Use docker
  description: A complete workflow demonstrating docker. Save it as workflow.yaml together with any supporting files.
  workflow: |
    version: 1
    name: docker-basic
    steps:
      - id: example
        type: docker
        with:
          image: alpine:3.22
          command: printf
          args:
            - |
              %s
            - Hello Wuko
          network: none
          pull: if-missing
  files: {}
  prerequisites:
    - A running Docker daemon
    - Network access to pull alpine:3.22 unless already cached
  expected: Runs printf in an isolated container, captures its output, and removes the managed container.
  check: ""
  run: false
