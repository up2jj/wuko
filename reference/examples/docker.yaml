    name: docker-login
    steps:
      - id: example
        type: docker
        with:
          operation: login
          auth:
            username: '{{ .env.EXAMPLE_REGISTRY_USER }}'
            password: '{{ .env.EXAMPLE_REGISTRY_PASSWORD }}'
            server_address: localhost:5000
