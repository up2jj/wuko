- id: health_wait
  title: 'Docker operation: health_wait'
  description: A complete workflow demonstrating docker. Save it as workflow.yaml together with any supporting files.
  workflow: |
    version: 1
    name: docker-health-wait
    steps:
      - id: bounded_health
        attempt:
          timeout: 30s
          steps:
            - id: example
              type: docker
              with:
                operation: health_wait
                container: wuko-example-service
  files: {}
  prerequisites:
    - A running Docker daemon; use a disposable Docker environment
    - Create a container named wuko-example-service first; for health_wait it must have a health check, and for copy_from it must contain /tmp/greeting.txt
  expected: Performs the documented health_wait operation against the prepared Docker environment.
  check: ""
