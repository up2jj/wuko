    - A running Docker daemon; use a disposable Docker environment
    - Run a test registry at localhost:5000; for push, tag a local image as localhost:5000/wuko-example:local
    - Export EXAMPLE_REGISTRY_USER and EXAMPLE_REGISTRY_PASSWORD for that registry without placing credentials in YAML
  expected: Performs the documented login operation against the prepared Docker environment.
  check: ""
  run: false
