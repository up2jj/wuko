- id: basic
  title: Use tui_review
  description: A complete workflow demonstrating tui_review. Save it as workflow.yaml together with any supporting files.
  workflow: |
    version: 1
    name: tui-review-basic
    steps:
      - id: example
        type: tui_review
        with:
          variable: approved
          message: Review the plan
          content: Create an example greeting file.
          default: false
  files: {}
  prerequisites:
    - An interactive terminal
  expected: Shows the plan and publishes the review decision; no deployment is performed.
  check: ""
  run: false
