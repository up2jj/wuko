- id: basic
  title: Use github_release
  description: A complete workflow demonstrating github_release. Save it as workflow.yaml together with any supporting files.
  workflow: |
    version: 1
    name: github-release-basic
    steps:
      - id: example
        type: github_release
        with:
          operation: check_drift
          repository: owner/repository
  files: {}
  prerequisites:
    - Authenticated gh CLI with access to the repository
    - Replace owner/repository with an accessible repository
  expected: Reports whether the default branch has changes since the latest release.
  check: ""
  run: false
