- id: basic
  title: Use file
  description: A complete workflow demonstrating file. Save it as workflow.yaml together with any supporting files.
  workflow: |
    version: 1
    name: file-basic
    steps:
      - id: write
        type: file
        with:
          operation: write
          path: greeting.txt
          content: |
            Hello Wuko
      - id: example
        type: file
        with:
          operation: read
          path: greeting.txt
  files: {}
  prerequisites: []
  expected: Creates greeting.txt in the invocation directory and reads it back. Run in an empty scratch directory.
  check: ""
  run: true
  expected_files:
    greeting.txt: |
      Hello Wuko
