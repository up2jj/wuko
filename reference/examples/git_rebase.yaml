- id: basic
  title: Use git_rebase
  description: A complete workflow demonstrating git_rebase. Save it as workflow.yaml together with any supporting files.
  workflow: |
    version: 1
    name: git-rebase-basic
    steps:
      - id: example
        type: git_rebase
        with:
          target: main
  files: {}
  prerequisites:
    - Git available on PATH; run in a disposable repository with an initial commit and a main branch
    - Check out a feature branch with commits beyond main
  expected: Rebases the current feature branch onto main.
  check: ""
  run: false
