- id: basic
  title: Use git_remote_branch
  description: A complete workflow demonstrating git_remote_branch. Save it as workflow.yaml together with any supporting files.
  workflow: |
    version: 1
    name: git-remote-branch-basic
    steps:
      - id: example
        type: git_remote_branch
        with:
          branch: example-absent
          remote: origin
          exists: false
  files: {}
  prerequisites:
    - Git available on PATH; run in a disposable repository with an initial commit and a main branch
    - Configure an origin remote; the example checks local remote-tracking refs without fetching
  expected: Runs the git_remote_branch operation against the disposable repository and exposes its documented outputs.
  check: ""
  run: false
