- id: basic
  title: Use key_value
  description: A complete workflow demonstrating key_value. Save it as workflow.yaml together with any supporting files.
  workflow: |
    version: 1
    name: key-value-basic
    steps:
      - id: save
        type: key_value
        with:
          operation: set
          scope: local
          store: example
          key: theme
          value: dark
      - id: example
        type: key_value
        with:
          operation: get
          scope: local
          store: example
          key: theme
      - id: verify
        type: assert
        with:
          expr: steps.example.value == "dark" && steps.example.found
          message: Example result must match the documented expectation
  files: {}
  prerequisites: []
  expected: Persists theme=dark in the local example store and reads it back.
  check: steps.example.value == "dark" && steps.example.found
  run: true
