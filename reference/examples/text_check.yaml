- id: basic
  title: Use text_check
  description: A complete workflow demonstrating text_check. Save it as workflow.yaml together with any supporting files.
  workflow: |
    version: 1
    name: text-check-basic
    steps:
      - id: example
        type: text_check
        with:
          files:
            - config.json
          parse: json
  files:
    config.json: |
      {"enabled":true}
  prerequisites: []
  expected: Succeeds because config.json contains valid JSON.
  check: ""
  run: true
